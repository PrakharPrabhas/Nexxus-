<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXUS Admin — Gallery</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body data-page="gallery">
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          ><div class="logo">N</div>
          <div>
            <h2>NEXUS</h2>
            <small>ADMIN PANEL</small>
          </div></a
        >
        <nav class="nav">
          <a data-page="dashboard" href="dashboard.html"
            ><span class="icon">⌂</span><span>Dashboard</span></a
          >
          <a data-page="members" href="members.html"
            ><span class="icon">◉</span><span>Members</span></a
          >
          <a data-page="events" href="events.html"
            ><span class="icon">◫</span><span>Events</span></a
          >
          <a data-page="gallery" href="gallery.html"
            ><span class="icon">▧</span><span>Gallery</span></a
          >
          <a data-page="projects" href="projects.html"
            ><span class="icon">◇</span><span>Projects</span></a
          >
          <a data-page="statistics" href="statistics.html"
            ><span class="icon">▥</span><span>Statistics</span></a
          >
          <a data-page="settings" href="settings.html"
            ><span class="icon">⚙</span><span>Settings</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <button class="btn full" data-logout>Logout</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1>Gallery</h1>
            <p class="subtitle">
              Manage images and media shown on the public website.
            </p>
          </div>
          <button class="btn primary" data-modal-open="galleryModal">
            + Add Media
          </button>
        </header>
        <div class="notice">
          Paste an image URL for now. Direct uploads will be added later.
        </div>
        <div id="galleryGrid" class="gallery-grid"></div>
        <div class="modal" id="galleryModal">
          <div class="modal-box">
            <div class="modal-head">
              <h3>Add Gallery Item</h3>
              <button class="close" data-modal-close>×</button>
            </div>
            <form id="galleryForm">
              <div class="modal-body">
                <input type="hidden" name="id" />
                <div class="form-grid">
                  <div class="field full-row">
                    <label>Title *</label><input name="title" required />
                  </div>
                  <div class="field">
                    <label>Category</label
                    ><input name="category" placeholder="Events" />
                  </div>
                  <div class="field">
                    <label>Status</label
                    ><select name="status">
                      <option>Active</option>
                      <option>Inactive</option>
                    </select>
                  </div>
                  <div class="field full-row">
                    <label>Image URL *</label
                    ><input
                      name="imageUrl"
                      type="url"
                      placeholder="https://..."
                      required
                    />
                  </div>
                  <div class="field full-row">
                    <label>Description</label
                    ><textarea name="description"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-foot">
                <button type="button" class="btn" data-modal-close>
                  Cancel</button
                ><button class="btn primary">Add Media</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
