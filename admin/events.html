<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXUS Admin — Events</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body data-page="events">
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          ><div class="logo">N</div>
          <div>
            <h2>NEXUS</h2>
            <small>ADMIN PANEL</small>
          </div></a
        >
        <nav class="nav">
          <a data-page="dashboard" href="dashboard.html"
            ><span class="icon">⌂</span><span>Dashboard</span></a
          >
          <a data-page="members" href="members.html"
            ><span class="icon">◉</span><span>Members</span></a
          >
          <a data-page="events" href="events.html"
            ><span class="icon">◫</span><span>Events</span></a
          >
          <a data-page="gallery" href="gallery.html"
            ><span class="icon">▧</span><span>Gallery</span></a
          >
          <a data-page="projects" href="projects.html"
            ><span class="icon">◇</span><span>Projects</span></a
          >
          <a data-page="statistics" href="statistics.html"
            ><span class="icon">▥</span><span>Statistics</span></a
          >
          <a data-page="settings" href="settings.html"
            ><span class="icon">⚙</span><span>Settings</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <button class="btn full" data-logout>Logout</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1>Events</h1>
            <p class="subtitle">
              Control events, schedules, venues and registration links.
            </p>
          </div>
          <button class="btn primary" data-modal-open="eventModal">
            + Create Event
          </button>
        </header>
        <div class="card">
          <div class="card-body">
            <div class="toolbar">
              <input
                id="eventSearch"
                class="search"
                placeholder="Search events..."
              />
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Venue</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="eventRows"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal" id="eventModal">
          <div class="modal-box">
            <div class="modal-head">
              <h3>Event Details</h3>
              <button class="close" data-modal-close>×</button>
            </div>
            <form id="eventForm">
              <div class="modal-body">
                <input type="hidden" name="id" />
                <div class="form-grid">
                  <div class="field full-row">
                    <label>Title *</label><input name="title" required />
                  </div>
                  <div class="field">
                    <label>Date *</label
                    ><input name="date" type="date" required />
                  </div>
                  <div class="field">
                    <label>Time</label><input name="time" type="time" />
                  </div>
                  <div class="field">
                    <label>Venue</label><input name="venue" />
                  </div>
                  <div class="field">
                    <label>Status</label
                    ><select name="status">
                      <option>Upcoming</option>
                      <option>Completed</option>
                      <option>Cancelled</option>
                    </select>
                  </div>
                  <div class="field full-row">
                    <label>Registration Link</label><input name="link" />
                  </div>
                  <div class="field full-row">
                    <label>Description</label
                    ><textarea name="description"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-foot">
                <button type="button" class="btn" data-modal-close>
                  Cancel</button
                ><button class="btn primary">Save Event</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
