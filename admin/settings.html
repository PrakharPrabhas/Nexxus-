<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXUS Admin — Settings</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body data-page="settings">
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="dashboard.html"
          ><div class="logo">N</div>
          <div>
            <h2>NEXUS</h2>
            <small>ADMIN PANEL</small>
          </div></a
        >
        <nav class="nav">
          <a data-page="dashboard" href="dashboard.html"
            ><span class="icon">⌂</span><span>Dashboard</span></a
          >
          <a data-page="members" href="members.html"
            ><span class="icon">◉</span><span>Members</span></a
          >
          <a data-page="events" href="events.html"
            ><span class="icon">◫</span><span>Events</span></a
          >
          <a data-page="gallery" href="gallery.html"
            ><span class="icon">▧</span><span>Gallery</span></a
          >
          <a data-page="projects" href="projects.html"
            ><span class="icon">◇</span><span>Projects</span></a
          >
          <a data-page="statistics" href="statistics.html"
            ><span class="icon">▥</span><span>Statistics</span></a
          >
          <a data-page="settings" href="settings.html"
            ><span class="icon">⚙</span><span>Settings</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <button class="btn full" data-logout>Logout</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1>Settings</h1>
            <p class="subtitle">
              Update public club information and social links.
            </p>
          </div>
        </header>
        <form id="settingsForm" class="settings-grid">
          <div class="card setting-card">
            <h3>Club Information</h3>
            <div class="setting-fields">
              <div class="field">
                <label>Site Name</label><input name="siteName" />
              </div>
              <div class="field">
                <label>Tagline</label><input name="tagline" />
              </div>
              <div class="field">
                <label>Club Email</label><input name="email" type="email" />
              </div>
              <div class="field">
                <label>Phone</label><input name="phone" />
              </div>
              <div class="field">
                <label>Logo URL</label><input name="logo" type="url" />
              </div>
              <div class="field">
                <label>Club Description</label
                ><textarea name="about"></textarea>
              </div>
              <div class="field">
                <label
                  ><input name="maintenanceMode" type="checkbox" />
                  Maintenance mode</label
                >
              </div>
            </div>
          </div>
          <div class="card setting-card">
            <h3>Social Links</h3>
            <div class="setting-fields">
              <div class="field">
                <label>Instagram</label><input name="instagram" />
              </div>
              <div class="field">
                <label>LinkedIn</label><input name="linkedin" />
              </div>
              <div class="field">
                <label>GitHub</label>
                <input name="github" />
              </div>
            </div>
          </div>
          <div style="grid-column: 1/-1">
            <button class="btn primary" type="submit">Save Settings</button>
          </div>
        </form>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
